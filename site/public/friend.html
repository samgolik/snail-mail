<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#eef2e8">
  <title>add a snail mail friend</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/friend.js" defer></script>
</head>
<body>
  <main>
    <section class="card">
      <p class="eyebrow">a tiny address request</p>
      <h1 id="invite-title">someone sent you their snail mail address</h1>
      <p>Open Snail Mail to add this handle to your address book. You can review the request before sending it.</p>
      <p><a id="open-app" class="button" href="/">open snail mail</a></p>
      <p class="small">Don’t have the app yet? <a href="https://apps.apple.com/app/id6829490432">Download Snail Mail on the App Store.</a></p>
    </section>
  </main>
</body>
</html>
